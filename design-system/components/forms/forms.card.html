<!-- @dsCard group="Componentes" viewport="700x780" name="Formularios" subtitle="Campo, selector, casilla y formulario con errores" -->
<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles.css"></head>
<body style="padding:24px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
<div class="mf-field"><label class="mf-label" for="a">Normal</label><input class="mf-input" id="a" placeholder="Tu nombre"></div>
<div class="mf-field"><label class="mf-label" for="b">Foco</label><input class="mf-input" id="b" value="Ana" style="border-color:var(--mf-color-primary);box-shadow:4px 4px 0 0 var(--mf-color-primary)"></div>
<div class="mf-field"><label class="mf-label" for="c">Tu WhatsApp</label><input class="mf-input" id="c" value="55 123" aria-invalid="true"><p class="mf-errmsg"><span class="mf-icon mf-i-alert"></span>Escribe 10 dígitos, sin lada de país.</p></div>
<div class="mf-field"><label class="mf-label" for="d">Deshabilitado</label><input class="mf-input" id="d" value="No editable" disabled></div>
<div class="mf-field"><label class="mf-label" for="e">¿En qué vas?</label><div class="mf-select-wrap"><select class="mf-select" id="e"><option>Ya terminé la secundaria</option></select><span class="mf-icon mf-i-chevron-down"></span></div></div>
<div style="display:grid"><label class="mf-check"><input type="checkbox" checked><span>Marcada</span></label><label class="mf-check"><input type="checkbox" aria-invalid="true"><span>Con error</span></label><label class="mf-check"><input type="checkbox" checked disabled><span>Deshabilitada</span></label></div></div>
<div class="mf-card" style="margin-top:24px;display:grid;gap:16px"><h3 class="mf-h3">Formulario completo · estado de error</h3>
<form class="mf-form" novalidate onsubmit="return false"><div class="mf-alert mf-alert--error" role="alert"><span class="mf-icon mf-i-alert"></span><div>Revisa 2 campos:<ul><li>Escribe tu nombre.</li><li>Necesitamos tu permiso para escribirte.</li></ul></div></div>
<div class="mf-form__row"><div class="mf-field"><label class="mf-label" for="n">Nombre</label><input class="mf-input" id="n" aria-invalid="true"><p class="mf-errmsg"><span class="mf-icon mf-i-alert"></span>Escribe tu nombre.</p></div><div class="mf-field"><label class="mf-label" for="t">Tu WhatsApp</label><p class="mf-help">10 dígitos</p><input class="mf-input" id="t" value="5512345678"></div></div>
<label class="mf-check"><input type="checkbox" aria-invalid="true"><span>Acepto que me contacten por WhatsApp según el aviso de privacidad.</span></label>
<button class="mf-btn mf-btn--primary mf-btn--lg mf-btn--block">Quiero que me escriban</button></form>
<div class="mf-alert mf-alert--success" role="status"><span class="mf-icon mf-i-check-circle"></span>Listo. Te escribimos por WhatsApp hoy mismo.</div></div></body></html>
