<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles.css"></head>
<body style="padding:24px"><div style="display:grid;gap:24px"><section class="mf-cookie mf-cookie--static" aria-label="Aviso de cookies"><p><strong>Usamos cookies</strong> para que el sitio funcione y, si aceptas, para medir qué páginas se visitan. Tú decides. <a class="mf-link--inline" href="#">Más información</a></p><div class="mf-cookie__actions"><button class="mf-btn mf-btn--secondary mf-btn--sm">Aceptar</button><button class="mf-btn mf-btn--secondary mf-btn--sm">Rechazar</button><button class="mf-btn mf-btn--secondary mf-btn--sm">Configurar</button></div></section>
<div class="mf-modal-backdrop mf-modal-backdrop--static" style="padding:24px;border-radius:12px"><div class="mf-modal" role="dialog" aria-modal="true" aria-labelledby="ck"><div class="mf-modal__head"><h2 id="ck" class="mf-h3">Preferencias de cookies</h2><button class="mf-iconbtn" aria-label="Cerrar"><span class="mf-icon mf-i-x"></span></button></div><p class="mf-small" style="color:var(--mf-color-text-soft)">Elige qué permites. Puedes cambiarlo cuando quieras desde el pie de página.</p>
<div class="mf-modal__list"><label class="mf-check"><input type="checkbox" checked disabled><span class="mf-check__text"><strong>Necesarias</strong><small>Hacen que el sitio funcione. Siempre activas.</small></span></label><label class="mf-check"><input type="checkbox" checked><span class="mf-check__text"><strong>Medición</strong><small>Cuentan visitas de forma anónima.</small></span></label><label class="mf-check"><input type="checkbox"><span class="mf-check__text"><strong>Publicidad</strong><small>Miden si llegaste desde un anuncio.</small></span></label></div>
<div class="mf-modal__foot"><button class="mf-btn mf-btn--secondary">Rechazar todo</button><button class="mf-btn mf-btn--secondary">Guardar selección</button></div></div></div></div></body></html>
